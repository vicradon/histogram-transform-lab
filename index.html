<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Histogram Transform Lab</title>
<style>
/* ==== Theme and base elements ==== */
:root{--bg:#f3f2ee;--card:#fff;--ink:#1d2024;--mut:#6d7178;--line:#d9d8d2;--acc:#0b6e69;--hist:#c6cbd0;--curve:#d4452b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121416;--card:#1b1e21;--ink:#e8e9ea;--mut:#8f949b;--line:#32363b;--acc:#4fc3bb;--hist:#3c434a;--curve:#ff7a5c}}
:root[data-theme="dark"]{--bg:#121416;--card:#1b1e21;--ink:#e8e9ea;--mut:#8f949b;--line:#32363b;--acc:#4fc3bb;--hist:#3c434a;--curve:#ff7a5c}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:16px;margin:0;font-weight:600}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mut{color:var(--mut)}
main{min-width:0}
[hidden]{display:none!important}
/* ==== Layout, tabs and the session strip ==== */
.layout{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:16px;align-items:start}
@media(max-width:700px){.layout{grid-template-columns:1fr}.side{flex-direction:row!important;overflow-x:auto}}
.side{display:flex;flex-direction:column;gap:10px;position:sticky;top:70px}
.thumb{position:relative;border:2px solid var(--line);border-radius:4px;background:var(--card);padding:0;width:96px;height:80px;flex:none;overflow:hidden}
.thumb.on{border-color:var(--acc)}
.thumb canvas{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated}
.thumb .x{position:absolute;top:2px;right:2px;font-size:11px;padding:0 5px;line-height:16px;background:var(--card)}
.empty{border:2px dashed var(--line);border-radius:8px;padding:48px 20px;text-align:center;color:var(--mut);cursor:pointer;transition:border-color .15s}
.empty b{color:var(--ink);font-size:16px;display:block;margin-bottom:6px}
.empty:hover,.empty:focus-visible{border-color:var(--acc)}
.tabs{display:flex;gap:4px;padding:6px 16px 0;border-bottom:1px solid var(--line);background:var(--card);overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px;white-space:nowrap}
.tabs button[aria-selected=true]{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
.thumb.add{border-style:dashed;font-size:30px;line-height:1;color:var(--mut);display:flex;align-items:center;justify-content:center}
.thumb .emp{display:flex;height:100%;align-items:center;justify-content:center;font-size:12px;color:var(--mut)}
/* ==== Shared controls: cards, rows, chips, menus, segmented buttons, number inputs ==== */
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sw input{accent-color:var(--acc);width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:0 0 14px;padding:12px}
.card h2{font-size:13px;margin:0 0 10px;display:flex;gap:10px;align-items:center;font-weight:600}
.card h2 .sp{flex:1}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
canvas.v{display:block;max-width:100%;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.cap{font-size:11px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:36px;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.row2{display:flex;gap:8px;align-items:flex-start}
.row2 canvas.v{width:calc(50% - 4px);max-height:none;height:auto}
.menu{position:absolute;right:0;top:100%;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px;min-width:240px;box-shadow:0 4px 14px #0003}
.menu button{display:block;width:100%;text-align:left;border:0;background:none}
.menu button:disabled{opacity:.45;cursor:not-allowed}
.mh{display:flex;justify-content:space-between;align-items:center;position:relative;margin-bottom:6px}
.ibtn{padding:6px 9px;display:inline-flex}
.col>canvas.v{align-self:flex-start;max-width:100%}
.sw input.sq,.sw input[type=number],input.sq{width:44px;height:44px;box-sizing:border-box;padding:0;text-align:center;font:600 15px monospace;border:1.5px solid var(--mut);border-radius:6px;background:var(--card);color:var(--ink);box-shadow:inset 0 1px 3px #0003;-moz-appearance:textfield}
.sw input.sq:focus,.sw input[type=number]:focus{border-color:var(--acc)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
button[title^='Use']{width:44px;height:44px;padding:0;font-size:16px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;border-radius:0;background:var(--card);padding:5px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--bg);font-weight:600}
/* ==== Histogram tab ==== */
.img{max-height:300px;width:auto;height:auto;background:repeating-conic-gradient(#8883 0 25%,transparent 0 50%) 0 0/12px 12px}
.ctl{display:grid;grid-template-columns:36px 1fr 46px;gap:8px;align-items:center;font-size:12px}
.ctl input[type=range]{width:100%;accent-color:var(--acc)}
.ctl output{text-align:right;font-variant-numeric:tabular-nums}
.add{margin-top:10px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tile{display:flex;flex-direction:column;gap:6px;align-items:center;padding:6px;text-align:center;font-size:12px;line-height:1.25}
.tile canvas{display:block;max-width:100%}
.tile .c{width:112px;height:112px;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.tile .r{width:auto;height:auto;max-width:112px;max-height:84px;border-radius:2px}
/* ==== Bit-plane tab ==== */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px}
.bgrid .card{margin:0}
/* ==== Kernels tab ==== */
body[data-tab=kern] #pdf,body[data-tab=kern] #grayw{display:none}
.km{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px}
.km pre{margin:0;font:12px/1.15 monospace}
.ked{display:grid;gap:3px}
.kc{width:32px;height:32px;padding:0;font:600 14px monospace}
.kc[data-v='1']{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.kc[data-v='0']{background:var(--curve);color:var(--bg);border-color:var(--curve)}
.kcv{width:100%;max-width:480px;height:auto;touch-action:none;cursor:crosshair}
.kcol{flex:1 1 360px;max-width:480px;min-width:0}
.tcells{display:flex;flex-wrap:wrap;gap:4px}
.tc{display:flex;flex-direction:column;align-items:center;gap:2px}
.tc input{width:38px;height:38px;box-sizing:border-box;padding:0;text-align:center;font:600 13px monospace;border:1.5px solid var(--mut);border-radius:6px;background:var(--card);color:var(--ink)}
.tc.chg input{box-shadow:0 0 0 2px var(--acc)}
.tc.ed input{background:color-mix(in srgb,var(--curve) 22%,var(--card))}
.tc.win input,.tc.win .tco{box-shadow:0 0 0 3px var(--ink)}
.tco{width:38px;height:38px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--mut);border-radius:6px;font:600 13px monospace;color:var(--mut)}
.tlab{height:38px;display:flex;align-items:center}
@keyframes kpulse{0%{box-shadow:0 0 0 0 var(--acc)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--acc) 30%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.pulse{animation:kpulse .7s ease-out 2}
.kwrap{position:relative;width:100%;max-width:480px}
.kghost{position:absolute;pointer-events:none;opacity:0;transition:opacity .3s ease}
.kghost.on{opacity:1}
canvas.kcv{background:transparent;border-color:transparent}
.kpulse{position:absolute;pointer-events:none;border:3px solid var(--acc);border-radius:4px;animation:kring 1.1s ease-out infinite}
@keyframes kring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 75%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.km[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset;background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.kact{flex-basis:100%;font-size:12px;margin-bottom:6px}
.kpanel{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;background:color-mix(in srgb,var(--acc) 5%,var(--card))}
.kph{flex-basis:100%;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin:0 0 4px}
.kg{display:flex;flex-direction:column;gap:3px}
.kgl{font-size:11px;color:var(--mut)}
/* ==== Otsu tab ==== */
body[data-tab=otsu] #pdf{display:none}
.ostat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.ostat div{border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ostat b{display:block;font:600 16px monospace}
.dstep{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);line-height:1.65}
.dn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--bg);display:flex;align-items:center;justify-content:center;font:600 12px monospace}
.dtab{border-collapse:collapse;margin:6px 0;font:13px monospace}
.dtab th,.dtab td{border:1px solid var(--line);padding:2px 12px;text-align:right}
.dtab tr.hl{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.dtab tr.cur td{font-weight:700}
.dstep mjx-container,.ostat mjx-container{color:var(--ink)}
.dstep mjx-container[display]{margin:.5em 0!important}
.dstep code{font:13px monospace}
.otip{position:absolute;top:6px;z-index:5;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.6;box-shadow:0 4px 14px #0003;white-space:nowrap}
.otip hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.otip mjx-container{color:var(--ink)}
.owrap canvas.v{display:block}
.ylab{position:relative;flex:none;width:22px}
.ylab>span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font-size:12px;color:var(--mut)}
.xlab{text-align:center;font-size:12px;color:var(--mut);max-width:700px;margin-top:3px;padding-left:28px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>window.MathJax={startup:{typeset:false},svg:{fontCache:'none'}};</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" onload="MathJax.startup.promise.then(function(){window.mjReady=true;document.head.appendChild(MathJax.svgStylesheet());if(typeof Core!=='undefined'&&App.tab==='otsu')Core.sync()})"></script>

<body>
<header>
  <h1>Histogram transform lab</h1>
  <label class="sw" id="grayw"><input type="checkbox" id="gray" checked> Convert to grayscale (RGB → gray)</label>
  <button id="pick">Open image…</button><input type="file" id="file" accept="image/*" hidden>
  <button id="pdf" hidden disabled>Export session as PDF</button><span class="mut" id="st"></span>
  <button id="undo" style="margin-left:auto;display:inline-flex;padding:6px" aria-label="Undo" title="Undo (Ctrl+Z)" disabled></button><button id="redo" style="display:inline-flex;padding:6px" aria-label="Redo" title="Redo (Ctrl+Y or Ctrl+Shift+Z)" disabled></button><button id="theme" style="display:inline-flex;padding:6px" aria-label="Toggle light or dark theme" title="Toggle light or dark theme"></button>
  <span class="mut">or paste with Ctrl/Cmd+V, or drop an image</span>
</header>
<nav class="tabs" role="tablist"><button role="tab" data-tab="hist" aria-selected="true">Histogram transforms</button><button role="tab" data-tab="bits" aria-selected="false">Bit-plane slicing</button><button role="tab" data-tab="kern" aria-selected="false">Kernels &amp; morphology</button><button role="tab" data-tab="otsu" aria-selected="false">Otsu threshold</button></nav>
<div class="layout">
  <div class="side" id="side"></div>
  <main id="main"></main>
</div>
<script>
/* Histogram transform lab.
   Layout of this script, in load order (each section only uses sections above it):
     App      shared state: the active tab and its sessions
     Algos    pure math, no DOM
     Core     sessions, persistence, undo/redo, tabs, theme, PDF helpers, tab registry
     HistTab, BitsTab, KernTab, OtsuTab   one per tab; each ends with registerTab(...)
     Boot     first render and restore
   Every section is a namespace object; each starts by importing what it needs from the sections above. */

/* ==== App: shared state ========================================================================== */
// The active tab's sessions live in App.sessions/App.cur; the other tabs' are parked in Core's ST until switched to.
const App={sessions:[],cur:null,nid:1,tab:'hist'};

/* ==== 1. ALGOS: pure math, no DOM ===================================================================== */
const Algos=(()=>{
const cdfOf=h=>{if(h._c)return h._c;const N=h.reduce((a,b)=>a+b,0)||1;let s=0,mn=0;const c=new Array(256);for(let i=0;i<256;i++){s+=h[i];c[i]=s;if(!mn&&s)mn=s}return h._c=c.map(v=>N===mn?0:Math.max(0,(v-mn)/(N-mn)*255))};
const meanOf=h=>{if(h._m!=null)return h._m;let n=0,s=0;h.forEach((v,i)=>{n+=v;s+=v*i});return h._m=n?s/n:128};
const lohi=(h,q)=>{const k='_l'+q;if(h[k])return h[k];const N=h.reduce((a,b)=>a+b,0),t=N*q/100;let s=0,lo=0,hi=255;for(let i=0;i<256;i++){s+=h[i];if(s>t){lo=i;break}}s=0;for(let i=255;i>=0;i--){s+=h[i];if(s>t){hi=i;break}}return h[k]=[lo,hi]};
const SF=(r,p)=>p.B<=p.A?(r<p.A?p.va:p.vb):r<=p.A?p.va:r>=p.B?p.vb:p.va+(r-p.A)*(p.vb-p.va)/(p.B-p.A);
const RP=(a,b)=>[['A','A',0,255,1,a],['B','B',0,255,1,b],['d','Δ',-255,255,1,0],['o','Out',0,2,1,0,'sel',['Black','Keep original','Fixed level']],['v','Lvl',0,255,1,0]];
const RF=(r,p)=>r>=p.A&&r<=p.B?r+p.d:(p.o===0?0:p.o===1?r:p.v);
const TR={
 linear:{n:'Linear (identity)',p:[],f:r=>r},
 section:{n:'Linear section',p:[['A','A',0,255,1,64],['B','B',0,255,1,160],['h','Δ',-255,255,1,70]],f:(r,p)=>r>=p.A&&r<=p.B?r+p.h:r},
 negative:{n:'Negative',p:[],f:r=>255-r},
 log:{n:'Log',p:[],f:r=>255*Math.log(1+r)/Math.log(256)},
 invlog:{n:'Inverse log (exponential)',p:[],f:r=>255*(Math.pow(256,r/255)-1)/255},
 gamma:{n:'Gamma',p:[['g','γ',-140,140,1,-35,'log']],f:(r,p)=>255*Math.pow(r/255,p.g)},
 nroot:{n:'nth root',p:[['n','n',1,10,.1,2]],f:(r,p)=>255*Math.pow(r/255,1/p.n)},
 npower:{n:'nth power',p:[['n','n',1,10,.1,2]],f:(r,p)=>255*Math.pow(r/255,p.n)},
 binary:{n:'Binary',p:[['t','T',0,255,1,128],['h','H',0,255,1,255]],f:(r,p)=>r>=p.t?p.h:0},
 range:{n:'Range keep (L1: A–B)',p:RP(80,160),f:RF},
 rangeHi:{n:'Keep above A (L2)',p:RP(100,255),f:RF},
 rangeLo:{n:'Keep below B (L3)',p:RP(0,160),f:RF},
 equalize:{n:'Histogram equalization',p:[],f:(r,p,h)=>h?cdfOf(h)[r]:r},
 autostretch:{n:'Auto stretch (min to max)',p:[['q','clip',0,20,.5,0]],f:(r,p,h)=>{if(!h)return r;const[lo,hi]=lohi(h,p.q);return hi<=lo?r:r<=lo?0:r>=hi?255:(r-lo)*255/(hi-lo)}},
 squeeze:{n:'Contrast squeeze',p:[['A','a',0,255,1,0],['B','b',0,255,1,255],['va','v_a',0,255,1,70],['vb','v_b',0,255,1,185]],f:SF},
 centershift:{n:'Center shift (move the mean)',p:[['c','C',0,255,1,128]],f:(r,p,h)=>r+(p.c-(h?meanOf(h):p.c))},
 stretch:{n:'Contrast stretch (clipped ramp)',p:[['A','a',0,255,1,70],['B','b',0,255,1,150],['va','v_a',0,255,1,0],['vb','v_b',0,255,1,180]],
  f:(r,p)=>p.B<=p.A?(r<p.A?p.va:p.vb):r<=p.A?p.va:r>=p.B?p.vb:p.va+(r-p.A)*(p.vb-p.va)/(p.B-p.A)},
 bsection:{n:'Binary section',p:[['A','A',0,255,1,80],['B','B',0,255,1,170],['h','H',0,255,1,255]],f:(r,p)=>r>=p.A&&r<=p.B?p.h:0}
};
const gv=v=>Math.pow(10,v/100); // gamma slider -> value (0.04..25)
function lum(d,i){return Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2])}
function hist(d){const h=new Array(256).fill(0);for(let i=0;i<d.length;i+=4)h[lum(d,i)]++;return h}
function toGray(d){const o=new Uint8ClampedArray(d.length);for(let i=0;i<d.length;i+=4){const y=lum(d,i);o[i]=o[i+1]=o[i+2]=y;o[i+3]=d[i+3]}return o}
function lutOf(n){const t=TR[n.type],p={};t.p.forEach(s=>{p[s[0]]=s[6]==='log'?gv(n.v[s[0]]):n.v[s[0]]});
 const l=new Uint8Array(256);for(let r=0;r<256;r++)l[r]=Math.max(0,Math.min(255,Math.round(t.f(r,p,n.inH))));return l}
function applyLut(d,l){const o=new Uint8ClampedArray(d.length);for(let i=0;i<d.length;i+=4){o[i]=l[d[i]];o[i+1]=l[d[i+1]];o[i+2]=l[d[i+2]];o[i+3]=d[i+3]}return o}
const bitLut=k=>{const l=new Uint8Array(256);for(let r=0;r<256;r++)l[r]=(r>>(k-1))&1?255:0;return l};
const maskLut=(m,norm)=>{const l=new Uint8Array(256);if(m)for(let r=0;r<256;r++)l[r]=norm?Math.round((r&m)*255/m):r&m;return l};
const lumLut=(d,l)=>{const o=new Uint8ClampedArray(d.length);for(let i=0;i<d.length;i+=4){const v=l[lum(d,i)];o[i]=o[i+1]=o[i+2]=v;o[i+3]=d[i+3]}return o};
const kIn=(G,x,y)=>x>=0&&y>=0&&x<G.W&&y<G.H;
function kbox(sh){if(sh.t==='free'){const X=sh.pts.map(p=>p[0]),Y=sh.pts.map(p=>p[1]);return[Math.min(...X),Math.min(...Y),Math.max(...X),Math.max(...Y)]}
 return[Math.min(sh.a[0],sh.b[0]),Math.min(sh.a[1],sh.b[1]),Math.max(sh.a[0],sh.b[0]),Math.max(sh.a[1],sh.b[1])]}
function kcells(G,sh){const{H:KH,W:KW}=G;
 const out=new Uint8Array(KW*KH),put=(x,y)=>{if(kIn(G,x,y))out[y*KW+x]=1};
 if(sh.t==='free'){const P=sh.pts;for(let i=0;i<P.length;i++){const[x0,y0]=P[i],[x1,y1]=P[i+1]||P[i],n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);
  for(let j=0;j<=n;j++)put(Math.round(x0+(x1-x0)*j/n),Math.round(y0+(y1-y0)*j/n))}return out}
 const[x0,y0,x1,y1]=kbox(sh),cx=(x0+x1+1)/2,cy=(y0+y1+1)/2,rx=(x1-x0+1)/2,ry=(y1-y0+1)/2;
 const inn=(x,y,ax,ay)=>{if(ax<=0||ay<=0)return false;const u=Math.abs(x+.5-cx)/ax,v=Math.abs(y+.5-cy)/ay;return sh.t==='ellipse'?u*u+v*v<=1:sh.t==='diamond'?u+v<=1:u<=1&&v<=1};
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(inn(x,y,rx,ry)&&(sh.fill||!inn(x,y,rx-1,ry-1)))put(x,y);
 return out}
function kraster(G,k){const{H:KH,W:KW}=G;const g=new Uint8Array(KW*KH);k.shapes.forEach(sh=>{const c=kcells(G,sh);for(let i=0;i<c.length;i++)if(c[i])g[i]=1});return g}

  +row(4,`Inside class ${tx('C_0')} the probabilities ${tx('p_i')} only add up to ${tx('\\omega_0')}, not to 1:${tx('\\sum_{i\\le t}p_i=\\omega_0='+f(w0,4),1)}To treat class 0 as a distribution of its own we renormalise it: ${tx('P(i\\mid C_0)=\\frac{p_i}{\\omega_0}')}, which now sums to ${tx('\\frac{\\omega_0}{\\omega_0}=1')}. Class 1 is renormalised the same way with ${tx('\\omega_1')}.`)
  +row(5,`The class mean is the mean of that renormalised distribution. The sum in its numerator is the <i>partial moment</i>, the part of ${tx('\\mu_T')} that comes from the levels up to ${tx('t')}. It is not a mean yet:${tx('\\mu(t)=\\sum_{i\\le t} i\\,p_i='+f(mom,2),1)}${tx('\\mu_0=\\sum_{i\\le t} i\\,P(i\\mid C_0)=\\frac{1}{\\omega_0}\\sum_{i\\le t} i\\,p_i=\\frac{\\mu(t)}{\\omega_0}=\\frac{'+f(mom,2)+'}{'+f(w0,4)+'}='+f(mu0,2),1)}So ${tx('1/\\omega_0')} does not rescale a mean. It turns a partial sum into a mean.`)
  +row(6,`Class 1 uses the rest of the moment, because the two parts add up to the overall mean:${tx('\\mu(t)+\\sum_{i>t} i\\,p_i=\\mu_T',1)}${tx('\\mu_1=\\frac{1}{\\omega_1}\\sum_{i>t} i\\,p_i=\\frac{\\mu_T-\\mu(t)}{\\omega_1}=\\frac{'+f(o.mt,2)+'-'+f(mom,2)+'}{'+f(w1,4)+'}='+f(mu1,2),1)}As a check, ${tx('\\omega_0\\mu_0+\\omega_1\\mu_1='+f(w0*mu0+w1*mu1,2)+'=\\mu_T')}.`)
  +row(7,`Between-class variance:${tx('\\sigma_B^2(t)=\\omega_0\\,\\omega_1\\,(\\mu_0-\\mu_1)^2='+f(w0,4)+'\\times'+f(w1,4)+'\\times('+f(mu0,2)+'-'+f(mu1,2)+')^2=\\mathbf{'+f(sb,1)+'}',1)}`)
  +row(8,`Repeat for every ${tx('t')} from 0 to 255 (that is the curve above) and keep the largest:${tx('t^{*}=\\arg\\max_{0\\le t\\le 255}\\,\\sigma_B^2(t)',1)}The best candidates:<table class='dtab'><tr><th>${tx('t')}</th><th>${tx('\\sigma_B^2')}</th></tr>${ranked.map(([i,v])=>`<tr class='${i===o.bt?'hl':''}${i===t?' cur':''}'><td>${i}</td><td>${f(v,1)}</td></tr>`).join('')}</table>${ties>1?`${ties} thresholds tie for the maximum (the curve is flat there), so Otsu keeps the first one: ${tx('t^{*}='+o.bt)}.`:`The winner is ${tx('t^{*}='+o.bt)}.`}`)
  +row(9,`Why this works: the total variance does not change with ${tx('t')}:${tx('\\sigma_T^2=\\sigma_W^2+\\sigma_B^2\\quad\\Longrightarrow\\quad '+f(o.vt,1)+'='+f(o.vt-sb,1)+'+'+f(sb,1),1)}so pushing the classes as far apart as possible (large ${tx('\\sigma_B^2')}) is the same as making each class as tight as possible (small ${tx('\\sigma_W^2')}).`)
  +(t===o.bt?'':`<div class='cap' style='margin-top:8px'>You are looking at ${tx('t='+t)}. The optimum is ${tx('t^{*}='+o.bt)} with ${tx('\\sigma_B^2='+f(o.best,1))}. Press \u201cOtsu optimum\u201d to see its derivation.</div>`);
 }
}
