<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Histogram Transform Lab</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>window.MathJax={startup:{typeset:false},svg:{fontCache:'none'}};</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" onload="MathJax.startup.promise.then(function(){window.mjReady=true;document.head.appendChild(MathJax.svgStylesheet());if(typeof Core!=='undefined'&&App.tab==='otsu')Core.sync()})"></script>
</head>
<body>
<header>
  <h1>Histogram transform lab</h1>
  <label class="sw" id="grayw"><input type="checkbox" id="gray" checked> Convert to grayscale (RGB → gray)</label>
  <button id="pick">Open image…</button><input type="file" id="file" accept="image/*" hidden>
  <button id="pdf" hidden disabled>Export session as PDF</button><span class="mut" id="st"></span>
  <button id="undo" style="margin-left:auto;display:inline-flex;padding:6px" aria-label="Undo" title="Undo (Ctrl+Z)" disabled></button><button id="redo" style="display:inline-flex;padding:6px" aria-label="Redo" title="Redo (Ctrl+Y or Ctrl+Shift+Z)" disabled></button><button id="theme" style="display:inline-flex;padding:6px" aria-label="Toggle light or dark theme" title="Toggle light or dark theme"></button>
  <span class="mut">or paste with Ctrl/Cmd+V, or drop an image</span>
</header>
<nav class="tabs" role="tablist"><button role="tab" data-tab="hist" aria-selected="true">Histogram transforms</button><button role="tab" data-tab="bits" aria-selected="false">Bit-plane slicing</button><button role="tab" data-tab="kern" aria-selected="false">Kernels &amp; morphology</button><button role="tab" data-tab="otsu" aria-selected="false">Otsu threshold</button></nav>
<div class="layout">
  <div class="side" id="side"></div>
  <main id="main"></main>
</div>
<!-- Script layout, in load order (each file only uses the ones above it). These are classic scripts, so the
     namespace consts they define (App, Algos, Core, HistTab, BitsTab, KernTab, OtsuTab) are shared globals.
     App: shared state. Algos: pure math, no DOM. Core: sessions, persistence, undo/redo, tabs, theme, PDF helpers,
     tab registry. One file per tab, each ending with registerTab(...). Boot: first render and restore. -->
<script src="js/algos.js"></script>
<script src="js/core.js"></script>
<script src="js/tabs/hist.js"></script>
<script src="js/tabs/bits.js"></script>
<script src="js/tabs/kern.js"></script>
<script src="js/tabs/kern-image.js"></script>
<script src="js/tabs/otsu.js"></script>
<script src="js/boot.js"></script>
</body></html>
